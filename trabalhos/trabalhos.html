<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentações &amp; Trabalhos — Dev SENAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-950 px-4 py-8 font-['Inter',sans-serif] text-white antialiased">
    <header class="mx-auto w-full max-w-6xl">
        <nav class="flex items-center justify-between rounded-full border border-slate-700 bg-slate-900/65 px-6 py-4 backdrop-blur-xl">
            <a href="../index.html" class="text-sm font-semibold text-slate-300 transition hover:text-white">
                &larr; Voltar para a Home
            </a>
            <span class="rounded-full border border-purple-400/30 bg-purple-400/10 px-3 py-1 text-xs font-semibold uppercase text-purple-300">Central de Trabalhos</span>
        </nav>
    </header>

    <main class="mx-auto w-full max-w-6xl py-12">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Trabalhos da Turma</h1>
            <p class="mt-3 text-slate-400">Selecione um tema para ver os detalhes e a apresentação do aluno.</p>
        </header>

        <div id="projectsGrid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    </main>

    <script src="trabalhos.js"></script>
    <script>
        const grid = document.getElementById("projectsGrid");

        trabalhos.forEach((trabalho) => {
            const card = document.createElement("article");
            card.className = "flex min-h-56 flex-col rounded-2xl border border-slate-700 bg-slate-900/70 p-6 transition duration-200 hover:border-cyan-400/50 hover:bg-slate-900";

            const student = document.createElement("h2");
            student.className = "text-2xl font-bold leading-tight tracking-tight text-white";
            student.textContent = trabalho.aluno;

            const topicBlock = document.createElement("div");
            topicBlock.className = "mt-5 border-t border-slate-800 pt-4";

            const topicLabel = document.createElement("p");
            topicLabel.className = "text-xs font-medium text-slate-500";
            topicLabel.textContent = "Tema";

            const topic = document.createElement("p");
            topic.className = "mt-1 text-base font-medium text-slate-300";
            topic.textContent = trabalho.tema;
            topicBlock.append(topicLabel, topic);

            const link = document.createElement("a");
            link.className = "mt-auto inline-flex w-fit items-center gap-2 pt-6 text-sm font-semibold text-cyan-300 transition hover:text-cyan-200";
            link.href = `trabalho-detalhes.html?modulo=${encodeURIComponent(trabalho.id)}`;
            link.append(document.createTextNode("Ver trabalho"));
            const arrow = document.createElement("span");
            arrow.setAttribute("aria-hidden", "true");
            arrow.textContent = "→";
            link.append(arrow);

            card.append(student, topicBlock, link);
            grid.append(card);
        });
    </script>
</body>
</html>
