<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentações &amp; Trabalhos — Dev SENAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-950 px-4 py-8 font-['Inter',sans-serif] text-white antialiased">
    <header class="mx-auto w-full max-w-6xl">
        <nav class="flex items-center justify-between rounded-full border border-slate-700 bg-slate-900/65 px-6 py-4 backdrop-blur-xl">
            <a href="../index.html" class="text-sm font-semibold text-slate-300 transition hover:text-white">
                &larr; Voltar para a Home
            </a>
            <span class="rounded-full border border-purple-400/30 bg-purple-400/10 px-3 py-1 text-xs font-semibold uppercase text-purple-300">Central de Trabalhos</span>
        </nav>
    </header>

    <main class="mx-auto w-full max-w-6xl py-12">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Trabalhos da Turma</h1>
            <p class="mt-3 text-slate-400">Selecione um tema para ver os detalhes e a apresentação do aluno.</p>
        </header>

        <div id="projectsGrid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    </main>

    <script src="trabalhos.js"></script>
    <script>
        const grid = document.getElementById("projectsGrid");

        trabalhos.forEach((trabalho) => {
            const card = document.createElement("article");
            card.className = "flex flex-col rounded-3xl border border-slate-700 bg-slate-900/65 p-6 transition duration-300 hover:-translate-y-1 hover:border-cyan-400/60 hover:shadow-xl hover:shadow-cyan-950/20";

            const label = document.createElement("p");
            label.className = "text-xs font-semibold uppercase tracking-wider text-cyan-300";
            label.textContent = trabalho.aluno;

            const title = document.createElement("h2");
            title.className = "mt-3 text-xl font-semibold text-white";
            title.textContent = trabalho.tema;

            const link = document.createElement("a");
            link.className = "mt-6 inline-flex w-fit items-center rounded-lg bg-cyan-500 px-4 py-2 text-sm font-semibold text-slate-950 transition hover:bg-cyan-300";
            link.href = `trabalho-detalhes.html?modulo=${encodeURIComponent(trabalho.id)}`;
            link.textContent = "Ver trabalho";

            card.append(label, title, link);
            grid.append(card);
        });
    </script>
</body>
</html>
