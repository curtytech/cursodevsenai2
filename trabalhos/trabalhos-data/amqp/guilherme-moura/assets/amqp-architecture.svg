<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#0F1F3D"/>
    </linearGradient>
    
    <!-- Green Accent Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00B853"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152544"/>
      <stop offset="100%" stop-color="#0F1C35"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00FF88" />
    </marker>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="520" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Title / Badge -->
  <rect x="40" y="30" width="220" height="32" rx="6" fill="#00FF88" fill-opacity="0.12" stroke="#00FF88" stroke-width="1.2"/>
  <text x="150" y="51" fill="#00FF88" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">ARQUITETURA AMQP 0-9-1</text>
  
  <text x="40" y="90" fill="#FFFFFF" font-family="'Segoe UI', Inter, sans-serif" font-size="20" font-weight="700">Fluxo Completo de Mensageria no RabbitMQ Broker</text>
  <text x="40" y="112" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="13">Desacoplamento assíncrono entre produtores e consumidores via Exchanges e Queues</text>

  <!-- BROKER CONTAINER (DASHED BOX) -->
  <rect x="250" y="135" width="500" height="345" rx="12" fill="#0B1528" fill-opacity="0.8" stroke="#00FF88" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="265" y="145" width="180" height="24" rx="4" fill="#00E676" fill-opacity="0.15"/>
  <text x="355" y="161" fill="#00FF88" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">RABBITMQ BROKER (AMQP)</text>

  <!-- PRODUCER BOX -->
  <g transform="translate(40, 210)">
    <rect width="160" height="180" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.8"/>
    <circle cx="80" cy="50" r="26" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Producer Icon -->
    <path d="M70 50 L80 40 L90 50 M80 40 L80 62" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="80" y="105" fill="#FFFFFF" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">PRODUCER</text>
    <text x="80" y="125" fill="#38BDF8" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">(Publicador)</text>
    <text x="80" y="152" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="11" text-anchor="middle">Gera &amp; publica msgs</text>
    <text x="80" y="167" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="10" text-anchor="middle">Routing Key: "fila_teste"</text>
  </g>

  <!-- ARROW 1: Producer to Exchange -->
  <path d="M 200 300 L 285 300" stroke="#00FF88" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <rect x="208" y="272" width="70" height="20" rx="4" fill="#070D1E" stroke="#00FF88" stroke-width="0.8"/>
  <text x="243" y="286" fill="#00FF88" font-family="'Segoe UI', Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Publica</text>

  <!-- EXCHANGE BOX -->
  <g transform="translate(290, 195)">
    <rect width="170" height="210" rx="12" fill="url(#cardGrad)" stroke="#00FF88" stroke-width="2" filter="url(#glowGreen)"/>
    <rect width="170" height="210" rx="12" fill="url(#cardGrad)" stroke="#00FF88" stroke-width="1.5"/>
    <circle cx="85" cy="50" r="26" fill="#00E676" fill-opacity="0.2" stroke="#00FF88" stroke-width="1.5"/>
    <!-- Exchange Icon: Crossroads -->
    <path d="M73 50 L97 50 M85 38 L85 62 M77 42 L93 58 M77 58 L93 42" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round"/>
    <text x="85" y="102" fill="#FFFFFF" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">EXCHANGE</text>
    <text x="85" y="122" fill="#00FF88" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">(Roteador Central)</text>
    <line x1="15" y1="135" x2="155" y2="135" stroke="#1E293B" stroke-width="1"/>
    <text x="85" y="152" fill="#E2E8F0" font-family="'Segoe UI', Inter, sans-serif" font-size="11" text-anchor="middle">Tipos de Roteamento:</text>
    <text x="85" y="170" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="10" text-anchor="middle">• Direct • Fanout</text>
    <text x="85" y="186" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="10" text-anchor="middle">• Topic • Headers</text>
  </g>

  <!-- BINDING ARROWS -->
  <!-- Upper binding to Queue 1 -->
  <path d="M 460 270 Q 500 240, 545 240" stroke="#00FF88" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="475" y="222" width="60" height="18" rx="3" fill="#070D1E" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="505" y="234" fill="#38BDF8" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Binding 1</text>

  <!-- Lower binding to Queue 2 -->
  <path d="M 460 330 Q 500 360, 545 360" stroke="#00FF88" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="475" y="358" width="60" height="18" rx="3" fill="#070D1E" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="505" y="370" fill="#38BDF8" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Binding 2</text>

  <!-- QUEUES CONTAINER -->
  <!-- Queue 1: fila_teste -->
  <g transform="translate(550, 195)">
    <rect width="180" height="95" rx="10" fill="url(#cardGrad)" stroke="#00FF88" stroke-width="1.6"/>
    <text x="18" y="28" fill="#00FF88" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700">QUEUE: fila_teste</text>
    <text x="18" y="46" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="10">Buffer FIFO em Memória/Disco</text>
    <!-- Visual message slots in queue -->
    <rect x="18" y="56" width="30" height="26" rx="4" fill="#00E676" fill-opacity="0.25" stroke="#00FF88" stroke-width="1.2"/>
    <text x="33" y="73" fill="#FFFFFF" font-family="'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">M1</text>

    <rect x="54" y="56" width="30" height="26" rx="4" fill="#00E676" fill-opacity="0.25" stroke="#00FF88" stroke-width="1.2"/>
    <text x="69" y="73" fill="#FFFFFF" font-family="'Segoe UI', Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">M2</text>

    <rect x="90" y="56" width="30" height="26" rx="4" fill="#00E676" fill-opacity="0.1" stroke="#00FF88" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="105" y="73" fill="#64748B" font-family="'Segoe UI', Inter, sans-serif" font-size="10" text-anchor="middle">...</text>

    <rect x="126" y="56" width="40" height="26" rx="4" fill="#1E293B"/>
    <text x="146" y="72" fill="#38BDF8" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Durable</text>
  </g>

  <!-- Queue 2: Outra Fila -->
  <g transform="translate(550, 315)">
    <rect width="180" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="18" y="28" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700">QUEUE: fila_secundaria</text>
    <text x="18" y="46" fill="#64748B" font-family="'Segoe UI', Inter, sans-serif" font-size="10">Buffer Secundário (Exemplo)</text>
    <rect x="18" y="54" width="28" height="22" rx="3" fill="#334155"/>
    <text x="32" y="69" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="9" text-anchor="middle">M_x</text>
  </g>

  <!-- ARROW 2: Queue to Consumer -->
  <path d="M 730 242 L 805 242" stroke="#00FF88" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <rect x="738" y="222" width="60" height="18" rx="3" fill="#070D1E" stroke="#00FF88" stroke-width="0.8"/>
  <text x="768" y="235" fill="#00FF88" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Consome</text>

  <!-- ARROW 3: ACK back from Consumer -->
  <path d="M 810 330 Q 770 330, 735 285" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrowCyan)" fill="none"/>
  <rect x="742" y="325" width="55" height="18" rx="3" fill="#070D1E" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="769" y="337" fill="#38BDF8" font-family="'Segoe UI', Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACK / NACK</text>

  <!-- CONSUMER BOX -->
  <g transform="translate(810, 210)">
    <rect width="150" height="180" rx="12" fill="url(#cardGrad)" stroke="#00FF88" stroke-width="1.8"/>
    <circle cx="75" cy="50" r="26" fill="#00E676" fill-opacity="0.25" stroke="#00FF88" stroke-width="1.5"/>
    <!-- Consumer Icon -->
    <path d="M65 50 L75 60 L85 50 M75 38 L75 60" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="75" y="105" fill="#FFFFFF" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">CONSUMER</text>
    <text x="75" y="125" fill="#00FF88" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">(Consumidor)</text>
    <text x="75" y="152" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="11" text-anchor="middle">Processa mensagens</text>
    <text x="75" y="167" fill="#38BDF8" font-family="'Segoe UI', Inter, sans-serif" font-size="10" text-anchor="middle">Envia confirmação (ACK)</text>
  </g>

  <!-- Bottom Legend / Footnote -->
  <rect x="40" y="475" width="920" height="28" rx="6" fill="#0A162B" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="493" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="11">
    <tspan fill="#00FF88" font-weight="700">Regra Fundamental AMQP 0-9-1:</tspan> O produtor NUNCA publica diretamente na fila. O envio é sempre endereçado à Exchange, que aplica as regras de roteamento.
  </text>
</svg>
