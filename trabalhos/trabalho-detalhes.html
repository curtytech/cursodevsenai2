<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho — Dev SENAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-950 px-4 py-8 font-['Inter',sans-serif] text-white antialiased">
    <header class="mx-auto w-full max-w-6xl">
        <nav class="flex items-center justify-between rounded-full border border-slate-700 bg-slate-900/65 px-6 py-4 backdrop-blur-xl">
            <a href="trabalhos.html" class="text-sm font-semibold text-slate-300 transition hover:text-white">
                &larr; Voltar para os Trabalhos
            </a>
            <span class="rounded-full border border-cyan-400/30 bg-cyan-400/10 px-3 py-1 text-xs font-semibold uppercase text-cyan-300">Trabalho da Turma</span>
        </nav>
    </header>

    <main class="mx-auto w-full max-w-4xl py-12">
        <header class="mb-10 text-center">
            <p id="studentName" class="text-sm font-semibold uppercase tracking-wider text-cyan-300"></p>
            <h1 id="topicTitle" class="mt-2 text-3xl font-bold tracking-tight text-white sm:text-4xl"></h1>
        </header>

        <section id="workCard" class="rounded-3xl border border-slate-700 bg-slate-900/65 p-6 sm:p-8">
            <h2 class="text-xl font-semibold">Apresentação</h2>
            <p id="presentationStatus" class="mt-3 text-slate-300"></p>
            <p class="mt-5 text-sm text-slate-400">Pasta do trabalho: <code id="folderPath" class="break-all text-cyan-200"></code></p>
            <div class="mt-6 flex flex-wrap gap-3">
                <button id="openSlideButton" type="button" class="hidden rounded-lg bg-cyan-500 px-4 py-2 font-semibold text-slate-950 transition hover:bg-cyan-300">
                    Abrir apresentação
                </button>
                <a href="trabalhos.html" class="inline-flex items-center rounded-lg border border-slate-600 px-4 py-2 font-semibold text-slate-200 transition hover:bg-slate-800">
                    Voltar à lista
                </a>
            </div>
        </section>

        <section id="notFound" class="hidden rounded-3xl border border-amber-400/30 bg-amber-400/5 p-6 text-center text-amber-100">
            Este trabalho não foi encontrado. Volte à lista e selecione um tema disponível.
        </section>
    </main>

    <div id="slideModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/85 p-4 backdrop-blur-md" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="mx-auto my-4 max-w-6xl rounded-3xl border border-slate-700 bg-slate-900 p-6 shadow-2xl">
            <div class="mb-4 flex items-center justify-between border-b border-slate-800 pb-4">
                <h2 id="modalTitle" class="text-xl font-bold text-white"></h2>
                <div class="flex items-center gap-3">
                    <a id="openInNewTab" target="_blank" rel="noopener noreferrer" class="rounded-lg border border-slate-700 px-3 py-1.5 text-xs text-slate-300 transition hover:bg-slate-800">Abrir em nova aba</a>
                    <button id="closeModalButton" type="button" class="rounded-lg bg-slate-800 p-2 text-slate-400 hover:text-white" aria-label="Fechar apresentação">Fechar</button>
                </div>
            </div>
            <div class="overflow-hidden rounded-2xl border border-slate-800 bg-black">
                <iframe id="slideFrame" class="h-[75vh] w-full border-0" title="Apresentação do aluno"></iframe>
            </div>
        </div>
    </div>

    <script src="trabalhos.js"></script>
    <script>
        const selectedId = new URLSearchParams(window.location.search).get("modulo");
        const trabalho = trabalhos.find((item) => item.id === selectedId);
        const workCard = document.getElementById("workCard");

        if (trabalho) {
            document.title = `${trabalho.tema} — ${trabalho.aluno}`;
            document.getElementById("studentName").textContent = trabalho.aluno;
            document.getElementById("topicTitle").textContent = trabalho.tema;
            document.getElementById("folderPath").textContent = trabalho.pasta;

            const status = document.getElementById("presentationStatus");
            const openSlideButton = document.getElementById("openSlideButton");
            if (trabalho.caminhoSlide) {
                status.textContent = "A apresentação está disponível para visualização.";
                openSlideButton.classList.remove("hidden");
                openSlideButton.addEventListener("click", () => openSlide(trabalho));
            } else {
                status.textContent = "Aguardando o envio da apresentação. A pasta do aluno já está preparada.";
            }
        } else {
            workCard.classList.add("hidden");
            document.getElementById("notFound").classList.remove("hidden");
        }

        const modal = document.getElementById("slideModal");
        const frame = document.getElementById("slideFrame");

        function openSlide(item) {
            document.getElementById("modalTitle").textContent = `${item.tema} — ${item.aluno}`;
            frame.src = item.caminhoSlide;
            document.getElementById("openInNewTab").href = item.caminhoSlide;
            modal.classList.remove("hidden");
            document.getElementById("closeModalButton").focus();
        }

        function closeModal() {
            modal.classList.add("hidden");
            frame.src = "about:blank";
        }

        document.getElementById("closeModalButton").addEventListener("click", closeModal);
        modal.addEventListener("click", (event) => {
            if (event.target === modal) closeModal();
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !modal.classList.contains("hidden")) closeModal();
        });
    </script>
</body>
</html>
