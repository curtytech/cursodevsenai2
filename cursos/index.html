<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Cursos & Vídeos - SENAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-cyan-600 flex items-center justify-center font-bold text-white shadow-lg shadow-cyan-500/20">
          S
        </div>
        <span class="font-bold text-lg tracking-tight text-slate-100">DEV SENAI <span class="text-cyan-400 font-normal">| Cursos</span></span>
      </div>
      <a href="../index.html" class="text-sm font-medium text-slate-400 hover:text-white transition-colors flex items-center gap-1">
        &larr; Voltar ao Início
      </a>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Player de Vídeo -->
      <section class="lg:col-span-2 space-y-4">
        <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800">
          <iframe 
            id="mainPlayer"
            class="w-full h-full border-0"
            src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
            title="Player de Vídeo do Curso"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>

        <!-- Info da Aula -->
        <div class="p-6 bg-slate-900/90 rounded-2xl border border-slate-800/80 shadow-sm space-y-3">
          <div class="flex items-center gap-2">
            <span id="lessonTag" class="px-3 py-1 text-xs font-semibold text-cyan-400 bg-cyan-950/80 rounded-full border border-cyan-800/60">
              Módulo 1 · Aula 1
            </span>
          </div>

          <h1 id="lessonTitle" class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-100">
            Criando a Primeira Estrutura HTML5
          </h1>
          
          <p id="lessonDescription" class="text-sm sm:text-base text-slate-400 leading-relaxed pt-1">
            Nesta aula introdutória, vamos aprender como estruturar uma página web moderna utilizando elementos semânticos do HTML5.
          </p>

          <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
            <span>Instrutor: <strong class="text-slate-200">Prof. Curty</strong></span>
            <span id="lessonDuration">Duração: <strong class="text-slate-200">10:15 min</strong></span>
          </div>
        </div>
      </section>

      <!-- Sidebar / Playlist -->
      <aside class="bg-slate-900/90 rounded-2xl border border-slate-800/80 p-5 flex flex-col h-full max-h-[650px] shadow-sm">
        <div class="border-b border-slate-800/80 pb-4 mb-4 flex items-center justify-between">
          <h2 class="text-lg font-bold text-slate-100">Conteúdo do Curso</h2>
          <span class="text-xs font-medium text-cyan-400 bg-cyan-950/60 px-2.5 py-1 rounded-full border border-cyan-900">
            4 Aulas
          </span>
        </div>

        <div id="playlist" class="space-y-2.5 overflow-y-auto pr-1 flex-1">
          
          <!-- Aula 1 (Ativa por padrão) -->
          <button 
            data-video-id="dQw4w9WgXcQ"
            data-title="Criando a Primeira Estrutura HTML5"
            data-tag="Módulo 1 · Aula 1"
            data-desc="Nesta aula introdutória, vamos aprender como estruturar uma página web moderna utilizando elementos semânticos do HTML5."
            data-duration="10:15 min"
            class="lesson-btn active-lesson w-full text-left p-3.5 rounded-xl bg-cyan-950/40 border border-cyan-500/40 text-cyan-200 transition-all flex items-center gap-3">
            <span class="text-xs font-mono font-bold bg-cyan-900/60 px-2.5 py-1 rounded-lg text-cyan-300 border border-cyan-700/50">01</span>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold truncate">Criando a Primeira Estrutura</p>
              <p class="text-xs text-cyan-400/70 mt-0.5">10:15 min</p>
            </div>
          </button>

          <!-- Aula 2 -->
          <button 
            data-video-id="L_LUpnjgPso"
            data-title="Estilizando com Tailwind CSS"
            data-tag="Módulo 1 · Aula 2"
            data-desc="Aprenda a aplicar utilitários do Tailwind CSS para construir layouts responsivos rapidamente."
            data-duration="15:40 min"
            class="lesson-btn w-full text-left p-3.5 rounded-xl bg-slate-800/40 border border-slate-800 text-slate-300 transition-all hover:bg-slate-800 hover:text-white flex items-center gap-3">
            <span class="text-xs font-mono font-medium bg-slate-900 px-2.5 py-1 rounded-lg text-slate-400 border border-slate-800">02</span>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate">Estilizando com Tailwind CSS</p>
              <p class="text-xs text-slate-500 mt-0.5">15:40 min</p>
            </div>
          </button>

          <!-- Aula 3 -->
          <button 
            data-video-id="UB1O30fR-EE"
            data-title="Componentes Responsivos no Grid"
            data-tag="Módulo 1 · Aula 3"
            data-desc="Dominando o CSS Grid Layout e breakpoints para diferentes tamanhos de tela."
            data-duration="12:20 min"
            class="lesson-btn w-full text-left p-3.5 rounded-xl bg-slate-800/40 border border-slate-800 text-slate-300 transition-all hover:bg-slate-800 hover:text-white flex items-center gap-3">
            <span class="text-xs font-mono font-medium bg-slate-900 px-2.5 py-1 rounded-lg text-slate-400 border border-slate-800">03</span>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate">Componentes Responsivos no Grid</p>
              <p class="text-xs text-slate-500 mt-0.5">12:20 min</p>
            </div>
          </button>

          <!-- Aula 4 -->
          <button 
            data-video-id="RGOj5yH7evE"
            data-title="Integrando com GitHub & Git Workflow"
            data-tag="Módulo 1 · Aula 4"
            data-desc="Como utilizar branches, Pull Requests e colaborar em projetos no GitHub."
            data-duration="18:05 min"
            class="lesson-btn w-full text-left p-3.5 rounded-xl bg-slate-800/40 border border-slate-800 text-slate-300 transition-all hover:bg-slate-800 hover:text-white flex items-center gap-3">
            <span class="text-xs font-mono font-medium bg-slate-900 px-2.5 py-1 rounded-lg text-slate-400 border border-slate-800">04</span>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate">Integrando com GitHub</p>
              <p class="text-xs text-slate-500 mt-0.5">18:05 min</p>
            </div>
          </button>

        </div>
      </aside>

    </div>
  </main>

  <!-- Script para trocar o vídeo ao clicar na playlist -->
  <script>
    document.querySelectorAll('.lesson-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const videoId = btn.dataset.videoId;
        const title = btn.dataset.title;
        const tag = btn.dataset.tag;
        const desc = btn.dataset.desc;
        const duration = btn.dataset.duration;

        // Atualiza o player iFrame do YouTube
        document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;

        // Atualiza textos
        document.getElementById('lessonTitle').textContent = title;
        document.getElementById('lessonTag').textContent = tag;
        document.getElementById('lessonDescription').textContent = desc;
        document.getElementById('lessonDuration').innerHTML = `Duração: <strong class="text-slate-200">${duration}</strong>`;

        // Atualiza destaque visual dos botões
        document.querySelectorAll('.lesson-btn').forEach(b => {
          b.className = "lesson-btn w-full text-left p-3.5 rounded-xl bg-slate-800/40 border border-slate-800 text-slate-300 transition-all hover:bg-slate-800 hover:text-white flex items-center gap-3";
        });
        btn.className = "lesson-btn active-lesson w-full text-left p-3.5 rounded-xl bg-cyan-950/40 border border-cyan-500/40 text-cyan-200 transition-all flex items-center gap-3";
      });
    });
  </script>

</body>
</html>
